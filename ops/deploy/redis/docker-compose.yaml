services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "10.104.0.18:6379:6379"
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD}"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
      - "--maxmemory"
      - "10gb"
      - "--maxmemory-policy"
      - "noeviction"
      - "--tcp-keepalive"
      - "60"
      - "--timeout"
      - "0"
      - "--save"
      - ""
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_ADDR: "redis://10.104.0.18:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_EXPORTER_WEB_LISTEN_ADDRESS: "10.104.0.18:9121"

volumes:
  redis_data:
