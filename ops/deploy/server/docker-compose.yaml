services:
  server:
    image: broccoli-server:v0.0.0-local
    restart: unless-stopped
    network_mode: host
    environment:
      BROCCOLI__SERVER__HOST: "0.0.0.0"
      BROCCOLI__SERVER__PORT: "3000"
      BROCCOLI__SERVER__ID: "${BROCCOLI_SERVER_ID}"
      BROCCOLI__SERVER__FRONTEND_DIST: /srv/dist
      BROCCOLI__SERVER__TRUSTED_PROXIES: '["10.104.0.14/32"]'
      BROCCOLI__SERVER__RATE_LIMIT_AUTH: "false"
      BROCCOLI__DATABASE__URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@10.104.0.17:5432/${POSTGRES_DB}"
      BROCCOLI__DATABASE__MAX_CONNECTIONS: "50"
      BROCCOLI__MQ__ENABLED: "true"
      BROCCOLI__MQ__URL: "redis://:${REDIS_PASSWORD}@10.104.0.18:6379"
      BROCCOLI__AUTH__JWT_SECRET: "${JWT_SECRET}"
      BROCCOLI__AUTH__SECURE_COOKIES: "false"
      BROCCOLI__PLUGIN__PLUGINS_DIR: /plugins
      BROCCOLI__STORAGE__BACKEND: "object_storage"
      BROCCOLI__STORAGE__DATA_DIR: /data
      BROCCOLI__STORAGE__OBJECT_STORAGE__BUCKET: "broccoli-blobs"
      BROCCOLI__STORAGE__OBJECT_STORAGE__REGION: "us-east-1"
      BROCCOLI__STORAGE__OBJECT_STORAGE__ENDPOINT: "http://10.104.0.19:8333"
      BROCCOLI__STORAGE__OBJECT_STORAGE__ACCESS_KEY: "${S3_ACCESS_KEY}"
      BROCCOLI__STORAGE__OBJECT_STORAGE__SECRET_KEY: "${S3_SECRET_KEY}"
      BROCCOLI__STORAGE__OBJECT_STORAGE__PATH_STYLE: "true"
      BROCCOLI__SUBMISSION__RATE_LIMIT_PER_MINUTE: "10000"
      BROCCOLI__BOOTSTRAP__ADMIN_USERNAME: "${ADMIN_USERNAME}"
      BROCCOLI__BOOTSTRAP__ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      BROCCOLI__OBSERVABILITY__LOG_FORMAT: "json"
      BROCCOLI__OBSERVABILITY__LOG_FILTER: "info,sqlx=warn,sea_orm=warn,sea_query=warn,broccoli_queue=warn"
      BROCCOLI__PLUGIN__POOL_MAX_INSTANCES: "256"
      # Contention should never produce a user-visible SystemError. Wait long
      # (1 hour) and let acquisitions queue. The proper architectural fix is
      # in-progress (see docs/profiling/run-2/journal.md).
      BROCCOLI__PLUGIN__CALL_TIMEOUT_SECS: "3600"
      # Cap concurrent batch-evaluator plugin calls per server. Default is core count
      # (8 here); Signpost fans out 20 testcase evaluations per submission, so an 8-slot
      # semaphore throttles aggressively. Lift to 64.
      BROCCOLI__PLUGIN__EVALUATOR_PARALLELISM: "64"
      BROCCOLI__OBSERVABILITY__OTLP__ENDPOINT: "http://10.104.0.15:4317"
      BROCCOLI__OBSERVABILITY__OTLP__SERVICE_NAME: "broccoli-server-${BROCCOLI_SERVER_ID}"
    volumes:
      - ./plugins:/plugins:ro
      - server_data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/broccoli-server", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  server_data:
