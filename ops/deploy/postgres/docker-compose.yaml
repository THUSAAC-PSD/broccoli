services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      # Bind to private IP so VPC peers can reach; UFW + bind together enforce isolation.
      - "10.104.0.17:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - "postgres"
      - "-c"
      - "max_connections=400"
      - "-c"
      - "shared_buffers=4GB"
      - "-c"
      - "effective_cache_size=12GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "log_lock_waits=on"
      - "-c"
      - "log_min_duration_statement=500"
      - "-c"
      - "idle_in_transaction_session_timeout=60000"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "pg_stat_statements.max=10000"
    volumes:
      # PG 18+ expects the mount at /var/lib/postgresql; image places data in subdirectory.
      - postgres_data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    network_mode: host
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@10.104.0.17:5432/${POSTGRES_DB}?sslmode=disable"
      PG_EXPORTER_WEB_LISTEN_ADDRESS: "10.104.0.17:9187"
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "true"

volumes:
  postgres_data:
