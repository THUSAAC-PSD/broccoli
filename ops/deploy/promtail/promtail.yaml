server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://10.104.0.15:3100/loki/api/v1/push

scrape_configs:
  # All Docker container stdout/stderr on this host.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.+)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'
    pipeline_stages:
      # Try to parse JSON logs (Broccoli emits structured tracing JSON when LOG_FORMAT=json)
      - cri: {}
      - json:
          expressions:
            level: level
            target: target
            request_id: fields.request_id
            run_id: fields.run_id
            submission_id: fields.submission_id
            judgement_id: fields.judgement_id
            worker_id: fields.worker_id
            plugin_id: fields.plugin_id
            trace_id: span.trace_id
      - labels:
          level:
          target:

  # systemd journal lines for the host (kernel, sshd, dockerd, etc.)
  - job_name: journal
    journal:
      max_age: 1h
      labels:
        job: systemd-journal
    relabel_configs:
      - source_labels: ['__journal__systemd_unit']
        target_label: 'unit'
      - source_labels: ['__journal__hostname']
        target_label: 'host'
