services:
  prometheus:
    image: prom/prometheus:v3.4.0
    restart: unless-stopped
    network_mode: host
    user: root
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.listen-address=10.104.0.15:9090
      - --web.enable-admin-api
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./targets:/etc/prometheus/targets:ro
      - prom_data:/prometheus

  jaeger:
    image: jaegertracing/jaeger:2.17.0
    restart: unless-stopped
    # Use bridge networking with explicit private-IP bindings — jaeger 2.x doesn't
    # accept CLI host-port overrides for its built-in services; binding via Docker
    # is the simplest way to keep it off the public interface.
    ports:
      - "10.104.0.15:16686:16686"
      - "10.104.0.15:4317:4317"
      - "10.104.0.15:4318:4318"

  loki:
    image: grafana/loki:3.4.3
    restart: unless-stopped
    network_mode: host
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: "10.104.0.15"
      GF_SERVER_HTTP_PORT: "3001"
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards-provisioning:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  prom_data:
  loki_data:
  grafana_data:
