global:
  scrape_interval: 15s

scrape_configs:
  - job_name: broccoli-server
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/server-targets.json
    metrics_path: /metrics

  - job_name: broccoli-worker
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/worker-targets.json
    metrics_path: /metrics

  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8889

  - job_name: postgres
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/postgres-targets.json

  - job_name: redis
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/redis-targets.json

  - job_name: node
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/node-targets.json

  - job_name: cadvisor
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/cadvisor-targets.json

  - job_name: seaweedfs
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/seaweedfs-targets.json
