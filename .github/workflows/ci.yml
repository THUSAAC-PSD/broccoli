name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_BACKTRACE: short

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt, clippy
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build plugin WASM artefacts
        run: ./scripts/build-plugins.sh

      - name: Test
        timeout-minutes: 45
        env:
          E2E_SANDBOX_BACKEND: mock
        run: cargo test --workspace --locked -- --test-threads=4

      - name: Documentation
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Build
        run: pnpm build

  release-bundled-feature:
    name: Release / bundled-stress-test feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-bundled-feature

      - name: Stage fixture binaries as embedded
        run: |
          mkdir -p packages/server/embedded/stress-test
          cp packages/server/tests/fixtures/embedded-stress-test/* \
             packages/server/embedded/stress-test/

      - name: Build (bundled feature)
        run: cargo build -p server --features bundled-stress-test --locked

      # The vanilla `Rust` job already runs the full server test suite. Here we
      # only re-run the tests that exercise the cfg-gated `/downloads` routes.
      - name: Test downloads endpoint
        run: cargo test -p server --features bundled-stress-test --locked --test integration -- downloads

  plugins:
    name: Plugins (host tests + fmt)
    runs-on: ubuntu-latest
    # The crates under `plugins/` are excluded from the cargo workspace, so the
    # `Rust` job's `--workspace` fmt/test never touches them. Cover them here.
    env:
      PLUGIN_CRATES: >-
        plugins/batch-evaluator
        plugins/communication-evaluator
        plugins/cooldown
        plugins/icpc
        plugins/ioi
        plugins/print
        plugins/print/client
        plugins/standard-checkers
        plugins/standard-languages
        plugins/submission-limit
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: plugins

      - name: Check formatting
        # rustfmt's CLI defaults to edition 2015, so pass --edition 2024 to match
        # the pre-commit hook that formats these crates.
        run: |
          set -euo pipefail
          for c in $PLUGIN_CRATES; do
            echo "== fmt $c =="
            find "$c/src" -name '*.rs' -print0 | xargs -0 -r rustfmt --edition 2024 --check
          done

      - name: Test
        run: |
          set -euo pipefail
          for c in $PLUGIN_CRATES; do
            echo "== test $c =="
            cargo test --locked --manifest-path "$c/Cargo.toml"
          done

  print-client-windows:
    name: Print client (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: print-client-windows
          workspaces: plugins/print/client

      # Compiles the cfg(windows) print path (bundled SumatraPDF + its
      # include_bytes!), which the Ubuntu jobs never build.
      - name: Check
        run: cargo check --locked --manifest-path plugins/print/client/Cargo.toml --target x86_64-pc-windows-msvc
